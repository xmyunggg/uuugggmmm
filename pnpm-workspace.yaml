packages:
  - core
  - web

overrides:
  # 8.0.3 是同时满足「修掉 critical 代码执行 + 多数 high」且「不改变协议字节编码」的最后一个版本。
  # 8.2.0 起会改变字段编码顺序，core/tests 中 13~28 个字节级协议用例失败（已验证），
  # 在协议层适配完成前不要升到 8.2.0+。
  'protobufjs': 8.0.3
  '@babel/traverse': 7.26.10
  # pushoo 锁在 axios@0.26.1（含多个 high），它只用 axios.get/.post 经典 API，
  # 升到 1.x 后 require('axios').default 仍然可用，因此统一强制到已修复版本。
  'axios@<1.20.0': 1.20.0

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - protobufjs
